<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/favicon-48.png"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="קליפון"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>קליפון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone-first column; a dark "film leader" band on top carries the logo and the clip title,
   chapters below are numbered folders exactly as they will land in Drive; a fixed send bar at the bottom. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#111B30; --muted:#566178; --line:#D3D9E4;
  --accent:#FFC21A; --accent-ink:#1B1500; --band:#111B30; --band-fg:#F4F6FA; --band-muted:#A9B3C7;
  --ok:#1C7A4C; --ok-bg:#DDF2E6; --wait-bg:#FFF0C2; --wait:#6B4E00; --danger:#B3261E; --bad-bg:#FBE1DE; --field:#F6F8FB;
  --display:"Karantina","Heebo","Arial Hebrew",Arial,sans-serif;
  --body:"Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B111D; --surface:#151E31; --ink:#EEF1F6; --muted:#9CA7BC; --line:#2A3650;
  --accent:#FFC21A; --accent-ink:#1B1500; --band:#060A13; --band-fg:#F4F6FA; --band-muted:#8E99AF;
  --ok:#6FD3A0; --ok-bg:#12382A; --wait-bg:#3D3210; --wait:#FFD866; --danger:#FF8A80; --bad-bg:#45191A; --field:#0F1727; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B111D; --surface:#151E31; --ink:#EEF1F6; --muted:#9CA7BC; --line:#2A3650;
  --accent:#FFC21A; --accent-ink:#1B1500; --band:#060A13; --band-fg:#F4F6FA; --band-muted:#8E99AF;
  --ok:#6FD3A0; --ok-bg:#12382A; --wait-bg:#3D3210; --wait:#FFD866; --danger:#FF8A80; --bad-bg:#45191A; --field:#0F1727; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.demo{background:var(--accent);color:var(--accent-ink);font-size:14px}
.demo-in{max-width:640px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px}
.tabs a{padding:6px 12px;border-radius:999px;color:var(--accent-ink);text-decoration:none;font-weight:500;border:1.5px solid var(--accent-ink)}
.tabs a[aria-current="page"]{background:var(--accent-ink);color:var(--accent)}

.band{background:var(--band);color:var(--band-fg)}
.band-in,.main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{padding-block:20px 22px;display:flex;gap:16px;align-items:center}
.logo{flex:none;width:52px;height:71px;background:var(--accent);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.band-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.brand{font-size:13px;letter-spacing:.14em;color:var(--band-muted);direction:ltr;text-align:right}
.band h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.band .sub{color:var(--band-muted);font-size:15px}

.main{padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:19px;font-weight:700}
.hint{color:var(--muted);font-size:15px}
label.lbl{font-weight:500;font-size:15px}
input[type=text],input[type=url],input[type=number],textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:96px;resize:vertical}
.title-in{font-family:var(--display);font-size:34px;line-height:1.1;padding:8px 12px}
.title-in::placeholder{font-family:var(--body);font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > .grow{flex:1 1 180px;min-width:0}

.steps{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:14px;display:grid;place-items:center;margin-top:1px}

.chap-head{display:flex;align-items:baseline;gap:10px}
.chap-num{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.appname{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.appname b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--accent)}
.appname small{font-size:13px;color:var(--band-muted)}
.quote{margin:4px 0;padding-inline:4px;display:flex;gap:10px;align-items:flex-start}
.quote::before{content:"\201D";font-family:var(--display);font-size:84px;line-height:.8;color:var(--accent);flex:none}
.quote blockquote{margin:0;font-family:var(--display);font-size:32px;line-height:1.05;text-wrap:balance}
.paid{font-size:14px;font-weight:700;background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:6px 10px;align-self:flex-start}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shots li{display:flex;gap:10px;align-items:baseline}
.shots b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;align-self:flex-start}
.shots .opt{color:var(--muted)}.shots .opt b{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{padding-inline-start:12px;border-inline-start:3px solid var(--accent)}
.songs{font-weight:700;font-size:15px;border-radius:8px;padding:8px 12px}
.songs.bad{background:var(--bad-bg);color:var(--danger)}
.songs.mid{background:var(--wait-bg);color:var(--wait)}
.songs.ok{background:var(--ok-bg);color:var(--ok)}
.shots li{align-items:center;gap:12px}
.shots li span{min-width:0;line-height:1.35}
.sk{flex:none;width:60px;height:60px;border-radius:10px;background:var(--field);border:1.5px solid var(--line)}
.sk .f{fill:var(--accent)} .sk .o{stroke:var(--ink);stroke-width:1.6} .sk .d{fill:var(--ink)}
.sk .b{fill:#FF9D8A} .sk .w{fill:#FFFFFF} .sk .hl{stroke:var(--field);stroke-width:1.4}
.ai-line{font-weight:500}
.mark{flex:none;width:58px;height:66px}
.mark .ph{fill:none;stroke:var(--band-fg);stroke-width:2.4}
.mark .c{fill:none;stroke:var(--accent);stroke-width:6.5;stroke-linecap:round}
.mark .e{fill:var(--band-fg)} .mark .ck{fill:#FF9D8A}
.mark .sm{fill:none;stroke:var(--band-fg);stroke-width:1.9;stroke-linecap:round}
.mark .bk{fill:none;stroke:var(--band-fg);stroke-width:2.6}
.mark .fr{fill:var(--accent)}
.mark .pl{fill:var(--accent-ink);stroke:var(--accent-ink);stroke-width:3.2;stroke-linejoin:round}
.band .logo{order:3;width:30px;height:41px;background:var(--band-fg);opacity:.9;align-self:flex-start}
.band .band-txt{flex:1}
.chap-head{align-items:center}
.chap-head .sk{width:52px;height:52px}
.sk .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.max{font-weight:400;font-size:15px;color:var(--muted);white-space:nowrap}
.toast{text-align:center;border-radius:16px}
.chap-count{margin-inline-start:auto;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--field);cursor:pointer;max-width:100%}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:-4px}
.badge{position:absolute;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--band);color:var(--band-fg);font-variant-numeric:tabular-nums}
.badge.n{top:5px;inset-inline-start:5px}
.badge.v{bottom:5px;inset-inline-start:5px;background:var(--accent);color:var(--accent-ink)}
.badge.e{bottom:5px;inset-inline-end:5px}
.badge.c{top:5px;inset-inline-end:5px;background:var(--accent);color:var(--accent-ink)}
.tools{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:15px;text-align:center}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links li{display:flex;gap:8px;align-items:center;background:var(--field);border-radius:8px;padding:6px 10px}
.links span{flex:1;min-width:0;overflow-wrap:anywhere;direction:ltr;text-align:left;font-size:14px}
.err{color:var(--danger);font-size:15px}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-weight:500}

.sendbar{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.sendbar-in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sendbar .cnt{flex:1;min-width:0;font-size:15px;color:var(--muted)}
.pad-bottom{height:76px}

.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--wait-bg);color:var(--wait);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.client-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.client-top h2{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.static{cursor:default;background:var(--field)}
.chip .x{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;color:var(--muted)}
.tree{font-family:var(--mono);font-size:14px;background:var(--field);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.tree .in{padding-inline-start:18px;display:flex;justify-content:space-between;gap:10px}
.tree .in span:last-child{color:var(--muted);white-space:nowrap}
details summary{cursor:pointer;font-weight:500;min-height:40px;display:flex;align-items:center}
details .body{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.kv{font-size:15px}.kv b{font-weight:500;color:var(--muted)}
.copybox{font-size:14px;background:var(--field);border-radius:8px;padding:10px;user-select:all;overflow-wrap:anywhere}
.toast{position:fixed;inset:auto 0 calc(96px + env(safe-area-inset-bottom,0px)) 0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--band);color:var(--band-fg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:9}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .2s ease-out} @keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}} }
</style>

<div id="app" dir="rtl" lang="he"></div>
<div id="toast" class="toast" dir="rtl" hidden></div>

/* ---------- sending to Google Drive ---------- */
let busy=false, prog='';
const pad3=n=>String(n).padStart(3,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setProg(t){ prog=t; const el=document.querySelector('.sendbar .cnt'); if(el) el.textContent=t; }
const warnLeave=e=>{ e.preventDefault(); e.returnValue=''; };
const keysOf=c=>c.chapters.map((_,i)=>String(i)).concat(['extra','ai']);
const folderOf=(c,k)=>(k==='extra'?pad(c.chapters.length+1)+'_השלמות':k==='ai'?'AI_סרטון':pad(+k+1)+'_'+c.chapters[+k]).replace(/[\/\\]/g,'-').replace(/\s+/g,'_');
const extOf=name=>((String(name).match(/\.[a-z0-9]{1,5}$/i)||[''])[0]).toLowerCase();

// Requests go as text/plain so the browser sends them straight to Apps Script without a CORS preflight.
async function api(body){
  const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'error'); return j;
}
async function retry(fn,tries=4){
  for(let i=0;;i++){ try{ return await fn(); }catch(e){ if(i>=tries-1) throw e; await sleep(1500*(i+1)*(i+1)); } }
}
const b64=blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); });

// Light compression for photos: long side up to IMG_MAX, JPEG at IMG_Q. Videos and anything that fails stay original.
async function shrink(file){
  if(!IMG_MAX||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) return file;
  try{
    const url=URL.createObjectURL(file), img=new Image(); img.src=url;
    try{ await img.decode(); } finally{ URL.revokeObjectURL(url); }
    const k=Math.min(1,IMG_MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',IMG_Q));
    return blob&&blob.size<file.size?new File([blob],'photo.jpg',{type:'image/jpeg'}):file;
  }catch(e){ return file; }
}

async function uploadOne(file,folderId,name,onBytes){
  const mime=file.type||'application/octet-stream';
  if(file.size<=CHUNK){
    const data=await b64(file);
    await retry(()=>api({action:'file',folderId,name,mime,data}));
    onBytes(file.size); return;
  }
  const {session}=await retry(()=>api({action:'start',folderId,name,mime,size:file.size}));
  let pos=0, fails=0;
  while(pos<file.size){
    const end=Math.min(pos+CHUNK,file.size);
    try{
      const data=await b64(file.slice(pos,end));
      const r=await api({action:'chunk',session,start:pos,size:file.size,data});
      const next=r.done?file.size:r.next; onBytes(next-pos); pos=next; fails=0;
    }catch(e){
      if(++fails>4) throw e;
      await sleep(1500*fails*fails);
      try{ const st=await api({action:'status',session,size:file.size}); const next=st.done?file.size:st.next; if(next>pos){ onBytes(next-pos); pos=next; } }catch(_){}
    }
  }
}

function notesText(c,sentNow,failed){ const ok=sentNow.length;
  const L=[];
  L.push(`===== משלוח ${c.sends} · ${new Date().toLocaleString('he-IL')} =====`);
  L.push(`לקוח: ${c.name||'(בלי שם)'} · ${typeLabel(c)}`);
  L.push('כותרת פתיחה: '+(c.title||'—'));
  L.push('שירים:');
  c.links.forEach((l,i)=>L.push(`  ${i+1}. ${l}`));
  if(c.song) L.push('  בלי קישור: '+c.song);
  if(!c.links.length&&!c.song) L.push('  —');
  L.push('הערות לגל:', c.notes||'—');
  if(c.revision) L.push('תיקונים:', c.revision);
  const fn=[];
  sentNow.forEach(f=>{ if(f.note) fn.push(`  ${f.driveName}: ${f.note}`); });
  if(fn.length) L.push('הערות לקבצים:', ...fn);
  L.push(`קבצים שהגיעו במשלוח הזה: ${ok}`+(failed?` · לא הגיעו: ${failed}`:''));
  return L.join('\n');
}

async function doSend(){
  const c=cur(); if(busy) return;
  if(!SCRIPT_URL){ c.sent=true; save(); render(); toast('מצב בדיקה: שום דבר לא נשלח באמת'); return; }
  busy=true; prog='מתחברים ל-Drive...'; render();
  window.addEventListener('beforeunload',warnLeave);
  const keys=keysOf(c), folders=keys.map(k=>folderOf(c,k));
  let msg='';
  try{
    const b=await retry(()=>api({action:'begin',client:c.name?folder(c):'בדיקה_'+folder(c),folders}));
    const jobs=[];
    keys.forEach((k,idx)=>{ let n=b.counts[idx]||0;
      fl(c,k).forEach(f=>{ if(!f.sent&&f.file) jobs.push({f,folderId:b.folders[idx],folder:folders[idx],num:++n}); }); });
    const total=jobs.reduce((s,j)=>s+j.f.file.size,0)||1;
    let doneB=0, doneN=0, failed=0, qi=0;
    const upd=()=>setProg(`שולחים ${doneN} מתוך ${jobs.length} · ${Math.min(99,Math.floor(doneB*100/total))}% · לא לסגור את הדף`);
    upd();
    const worker=async()=>{
      while(qi<jobs.length){
        const j=jobs[qi++], orig=j.f.file.size; let got=0;
        try{
          const up=await shrink(j.f.file), scale=orig/(up.size||1), name=pad3(j.num)+(extOf(up.name)||extOf(j.f.name));
          await uploadOne(up,j.folderId,name,d=>{ got+=d*scale; doneB+=d*scale; upd(); });
          j.f.sent=true; j.f.driveName=j.folder+'/'+name; doneN++;
          doneB+=orig-got;   // round off whatever the progress counter missed
        }catch(e){ console.error(e); failed++; doneB-=got; }
        upd();
      }
    };
    await Promise.all([worker(),worker(),worker()]);
    setProg('שומרים את ההערות...');
    c.sends=(c.sends||0)+1;
    await retry(()=>api({action:'notes',clientId:b.clientId,text:notesText(c,jobs.filter(j=>j.f.sent).map(j=>j.f),failed)}));
    c.sent=true; save();
    msg=failed?`${failed} קבצים לא נשלחו. לחצו שוב על "שלחו עדכון" כדי לנסות שוב.`:`נשלח לגל! ${doneN?doneN+' קבצים הגיעו.':'ההערות עודכנו.'}`;
  }catch(e){ console.error(e); msg='השליחה נכשלה. בדקו את החיבור לאינטרנט ונסו שוב.'; }
  busy=false; prog=''; window.removeEventListener('beforeunload',warnLeave);
  render(); toast(msg,7000);
}

window.addEventListener('hashchange',()=>{sel=null; if(location.hash!=='#client-page') openD=state.current; render();
  if(location.hash!=='#client-page'){ const el=document.getElementById('card-'+state.current); if(el&&el.scrollIntoView) el.scrollIntoView({block:'start'}); }});
render();
</script>
